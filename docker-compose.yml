services:
  postgres:
    image: postgres:16-alpine
    container_name: untangle-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graphrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.20-community
    container_name: untangle-neo4j
    environment:
      NEO4J_AUTH: neo4j/changeme
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # Web Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4jdata:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: untangle-qdrant
    ports:
      - "6333:6333" # HTTP REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrantdata:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: untangle-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  neo4jdata:
  qdrantdata:
  redisdata:

