<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research Realm — GraphRAG Explorer</title>

    <!-- ── Google Fonts preconnect (opens TCP connections early) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Three-font system:
      • Inter        → all UI surfaces, body text, chat, navigation
      • Fredoka      → gamified headings on the Town Explorer (playful, rounded letterforms)
      • JetBrains Mono → edge relation labels, chunk IDs, latency, code excerpts
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Material Symbols Outlined — variable font (opsz + wght + FILL + GRAD axes).
      FILL axis lets us switch between outline (0) and filled (1) icons in CSS:
        .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
